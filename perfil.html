<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil</title>

    <link rel="stylesheet" href="perfil.css">
</head>

<body>

    <div class="ventana-perfil">

        <!-- =========================
             PARTE SUPERIOR
             ========================= -->

        <div class="barra-superior">

            <h1>Perfil</h1>

        </div>


        <!-- =========================
             INFORMACIÓN DEL USUARIO
             ========================= -->

        <div class="informacion-usuario">

            <!-- FOTO DE PERFIL -->

            <div class="foto-perfil">

                <img src="" alt="Foto de perfil">

            </div>


            <!-- DATOS DEL USUARIO -->

            <div class="datos-usuario">

                <p class="nombre-usuario">
                    Nombre de usuario
                </p>

                <p>
                    Género:
                    <span>Masculino</span>
                </p>

                <p>
                    Fecha:
                    <span>17/09/2026</span>
                </p>

            </div>

        </div>


        <!-- =========================
             CURSOS ADQUIRIDOS
             ========================= -->

        <div class="seccion-cursos">

            <h2>Mis cursos</h2>


            <div class="cuadro-cursos">


                <!-- =========================
                     CURSO 1
                     ========================= -->

                <button class="curso-adquirido">

                    <div class="video-mini">

                        <span>▶</span>

                    </div>

                    <div class="informacion-curso">

                        <p class="nombre-curso">
                            Expresiones de personajes
                        </p>

                        <p class="tutor-curso">
                            tutor: Juan
                        </p>

                    </div>

                    <p class="precio-curso">
                        27.00
                    </p>

                </button>


                <!-- =========================
                     CURSO 2
                     ========================= -->

                <button class="curso-adquirido">

                    <div class="video-mini">

                        <span>▶</span>

                    </div>

                    <div class="informacion-curso">

                        <p class="nombre-curso">
                            Animación de cuerpo
                        </p>

                        <p class="tutor-curso">
                            tutor: Carlos
                        </p>

                    </div>

                    <p class="precio-curso">
                        49.00
                    </p>

                </button>


            </div>

        </div>

    </div>

</body>

</html>
